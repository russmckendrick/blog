name: Build and Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'scripts/**'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'scripts/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: 👨‍💻 Checkout code
        uses: actions/checkout@v6

      - name: 🌸 Setup PNPM
        uses: pnpm/action-setup@v6

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔒 Security audit
        run: pnpm audit

      # node_modules/.cache holds the OpenGraph cards rendered by Takumi
      # (og-images, ~2.5 GB for ~2,000 cards at about a second each to render)
      # plus the small hero-colour and link-preview caches. Blog images need no
      # cache: they are transformed on demand by Cloudflare.
      #
      # Restore and save are split on purpose. The key carries the run id so it
      # never matches exactly: restore always falls through to the newest
      # og-cache-* entry, and save always writes a fresh one at the end of the
      # job. The previous single actions/cache step only saved on a miss of its
      # content-hash key, so after the Takumi migration re-salted every card the
      # key kept hitting a pre-migration cache, nothing new was ever saved, and
      # every deploy re-rendered all ~2,000 cards (28 minutes of a 30 minute run).
      - name: 💾 Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.cache
          key: og-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            og-cache-${{ runner.os }}-

      - name: 🏗️ Build site
        run: pnpm run build
        env:
          NODE_ENV: production
          INSTAPAPER_CONSUMER_KEY: ${{ secrets.INSTAPAPER_CONSUMER_KEY }}
          INSTAPAPER_CONSUMER_SECRET: ${{ secrets.INSTAPAPER_CONSUMER_SECRET }}
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}

      # Saved even if a later step fails: every card rendered so far is valid.
      - name: 💾 Save build cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: node_modules/.cache
          key: og-cache-${{ runner.os }}-${{ github.run_id }}

      - name: 📊 Build summary
        run: |
          echo "### Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Directory Size:**" >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files Generated:**" >> $GITHUB_STEP_SUMMARY
          find dist -type f | wc -l >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 📝 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful! Site deployed to Cloudflare Workers.'
            })
